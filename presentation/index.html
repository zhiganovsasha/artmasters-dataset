<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Закрытая страница</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #FF0126;
  --indigo: #381C97;
  --violet: #590AEC;
  --bg: #F4F2FA;
  --card: #ffffff;
  --ink: #1D1B2E;
  --mute: #6B6A78;
  --line: #E3E0EE;
  --bad: #C2462E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14121F;
    --card: #1E1B2C;
    --ink: #EFEDF7;
    --mute: #9A97AC;
    --line: #322E46;
    --bad: #E2735B;
  }
}
* { box-sizing: border-box }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(89, 10, 236, .18), transparent 70%),
    var(--bg);
  color: var(--ink);
  font: 15px/1.55 Montserrat, "Segoe UI", Arial, sans-serif;
}
.wrap { width: min(420px, 100%) }
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 18px;
  font-weight: 700;
  letter-spacing: .02em;
}
.brand .dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 4px rgba(255, 1, 38, .15);
}
form {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 26px 24px;
  box-shadow: 0 18px 48px rgba(56, 28, 151, .12);
}
h1 { font-size: 18px; line-height: 1.3; margin: 0 0 6px }
p.sub { color: var(--mute); margin: 0 0 18px; font-size: 13.5px }
label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--mute);
  margin-bottom: 7px;
}
input, button {
  width: 100%;
  font: inherit;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
}
input:focus { outline: 2px solid var(--violet); outline-offset: 1px; border-color: transparent }
button {
  margin-top: 14px;
  background: linear-gradient(92deg, var(--red), #E0004C);
  color: #fff;
  border: 0;
  font-weight: 700;
  letter-spacing: .01em;
  cursor: pointer;
  transition: transform .12s ease, filter .12s ease;
}
button:hover { filter: brightness(1.06) }
button:active { transform: translateY(1px) }
button:disabled { opacity: .7; cursor: default }
#err { color: var(--bad); min-height: 1.4em; margin: 10px 0 0; font-size: 13px }
.foot { margin-top: 16px; text-align: center; color: var(--mute); font-size: 12px }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>ArtMasters</div>
  <form id="f" autocomplete="off">
    <h1>Страница закрыта паролем</h1>
    <p class="sub">Доступ к результатам исследования предоставляется по запросу.</p>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus aria-label="Пароль">
    <button id="go" type="submit">Открыть</button>
    <p id="err" role="alert"></p>
  </form>
  <div class="foot">Если пароль не подходит, запросите актуальный у координатора проекта.</div>
</div>

    btn.disabled = false;
  }
});
